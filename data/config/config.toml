persist_to_file = 1
daystamp_override = -1
timestamp_override = -1
quick_pass = true
auto_pass = false
scheduled_num = 420
timezone_offset = 28800

[algorithm]
default = "FAST-0"

[paths]
data = "./data"
cache = "./data/cache"
config = "./data/config"
global = "./data/global"
repo = "./data/repo"

[services]
audio = "playsound"
tts = "edgetts"
llm = "openai"
sync = "webdav"

[sync]

[interface.memorizor]
autovoice = true

[puzzles.mcq]
max_riddles_num = 2

[puzzles.cloze]
min_denominator = 3

[providers.tts.edgetts]
voice = "zh-CN-XiaoxiaoNeural"

[providers.llm.openai]
url = ""
key = ""

[providers.sync.webdav]
url = ""
username = ""
password = ""
remote_path = "/heurams/"
verify_ssl = true
